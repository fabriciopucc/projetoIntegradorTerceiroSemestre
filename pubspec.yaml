name: void_riddles
description: "Jogo RPG"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.0.0
  geolocator: ^14.0.2 
  cupertino_icons: ^1.0.8
  firebase_core: ^4.8.0
  cloud_firestore: ^6.4.0
  provider: ^6.1.5+1
  audioplayers: ^6.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:
  assets:
    - assets/images/
    - assets/images/cutscenes/
    - assets/images/characters/
    - assets/images/scenarios/
    - assets/audio/
    
  uses-material-design: true
  